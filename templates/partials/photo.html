{% macro photo_plate(label, class="", style="", src="") -%}
<!-- TODO: replace with real, licensed property photography ({{ label }}) —
     {% if src %}this is still the unlicensed design-mock stock photo, wired in temporarily on request{% else %}no source photo was available to wire in{% endif %} -->
<figure class="plate {{ class }}" style="{{ style }}">
  {%- if src %}
  <img class="photo-img" src="{{ src }}" alt="{{ label }}" loading="lazy">
  {%- else %}
  <div class="photo-slot">
    <svg aria-hidden="true" focusable="false" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="m21 15-5-5L5 21"></path></svg>
    <span>{{ label }}</span>
  </div>
  {%- endif %}
</figure>
{%- endmacro %}
